name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - run: pip install -r requirements/dev.txt -r requirements/core.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python -m pytest -q
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt -r requirements/core.txt
      - run: python -m pytest -q
      - name: Install script smoke test (no shortcuts)
        shell: powershell
        run: |
          .\install.ps1 -NoShortcuts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe launcher.pyw version
  blender:
    # real Blender scene generation with the bpy module (Linux only; renders are verified on the PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3
      - run: pip install -r requirements/dev.txt -r requirements/core.txt bpy
      - run: python -m pytest -q tests/test_visuals.py
